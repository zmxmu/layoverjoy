# LayoverJoy 本地联调环境。
# 真实密钥通过 env_file 从 ../.secrets/layoverjoy.env 注入，绝不复制进本文件。
# 启动：docker compose up --build
#   API: http://localhost:8080  Swagger: http://localhost:8080/docs
#   Android Emulator 访问 API: http://10.0.2.2:8080

services:
  db:
    image: postgres:16.6-alpine3.20
    environment:
      POSTGRES_USER: layoverjoy
      POSTGRES_PASSWORD: layoverjoy_local_only
      POSTGRES_DB: layoverjoy
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U layoverjoy -d layoverjoy"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7.4-alpine3.20
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile
    env_file:
      - ../.secrets/layoverjoy.env
    environment:
      # 容器内网地址覆盖本机默认值
      DATABASE_URL: postgresql://layoverjoy:layoverjoy_local_only@db:5432/layoverjoy
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      RUNTIME_TARGET: local
      # Atlas/Nosana 由可信本地后端调用；候选评估默认进程内执行（local-runner，诚实标注）。
      # 需要展示真隔离沙箱时：DAYTONA_MODE=live docker compose up
      DAYTONA_MODE: ${DAYTONA_MODE:-local-runner}
      # Nosana 推理部署（Ollama OpenAI-compatible endpoint；推理不校验 Bearer）。
      # 部署异常/不可达时自动降级模板解释并诚实标注。
      NOSANA_OPENAI_BASE_URL: ${NOSANA_OPENAI_BASE_URL:-https://3F7ZoStUp94NqH11NnjzoR55EooG9gtnLBKerABNFS4v.node.k8s.prd.nos.ci/v1}
      NOSANA_DEPLOYMENT_ID: ${NOSANA_DEPLOYMENT_ID:-DfQoerNYzsD3PSqngPKX1P7BffHU9k2i6oc3XW5811vR}
      NOSANA_MODEL: ${NOSANA_MODEL:-layoverjoy-qwen2.5-3b}
      # 流式 AI 推荐（Qwen2.5-1.5B-Instruct-AWQ 新部署）。
      # 一键回滚：NOSANA_STREAMING_ENABLED=false docker compose up -d --force-recreate api
      # → SSE 接口仍在，但直接返回模板结果；旧 3B 非流式解释接口不受影响。
      NOSANA_STREAMING_ENABLED: ${NOSANA_STREAMING_ENABLED:-true}
      NOSANA_STREAM_BASE_URL: ${NOSANA_STREAM_BASE_URL:-https://2F4cK5iT3Kngu4ayvM4ETKBq153chTkG7Xa7sASMg4jM.node.k8s.prd.nos.ci}
      NOSANA_STREAM_DEPLOYMENT_ID: ${NOSANA_STREAM_DEPLOYMENT_ID:-5XksocRPS2cPrjRittPfGxFNUDxJobfDCcr5Ax9EZR1e}
      # 请求的 model 值以 /v1/models 的实际 id 为准，此处仅作探测失败时的兜底。
      NOSANA_SERVED_MODEL: ${NOSANA_SERVED_MODEL:-layoverjoy-qwen2.5-1.5b}
      # Hugging Face 仓库名只进诊断日志，绝不作为请求参数。
      NOSANA_HF_MODEL: ${NOSANA_HF_MODEL:-Qwen/Qwen2.5-1.5B-Instruct-AWQ}
      NOSANA_MAX_TOKENS: ${NOSANA_MAX_TOKENS:-480}
      NOSANA_TEMPERATURE: ${NOSANA_TEMPERATURE:-0.2}
      NOSANA_TOP_P: ${NOSANA_TOP_P:-0.8}
      NOSANA_FIRST_TOKEN_TIMEOUT_MS: ${NOSANA_FIRST_TOKEN_TIMEOUT_MS:-8000}
      NOSANA_TOTAL_TIMEOUT_MS: ${NOSANA_TOTAL_TIMEOUT_MS:-20000}
      NOSANA_FALLBACK_ENABLED: ${NOSANA_FALLBACK_ENABLED:-true}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  monitor-worker:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile
    command: ["worker"]
    env_file:
      - ../.secrets/layoverjoy.env
    environment:
      DATABASE_URL: postgresql://layoverjoy:layoverjoy_local_only@db:5432/layoverjoy
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      RUNTIME_TARGET: local
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
